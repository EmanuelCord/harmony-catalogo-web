<!-- Estructura HTML recomendada para tarjetas del catálogo -->
<article class="product-card">
  <div class="product-badge">Tren Inferior</div>
  <div class="product-image-wrapper">
    <img src="img/prensa-45.jpg" alt="Prensa 45° Harmony Fitness" loading="lazy">
    <button class="quick-view-btn" data-id="prensa-45">
      <i class="icon-eye"></i> Ver Detalles
    </button>
  </div>
  <div class="product-content">
    <h3 class="product-title">Prensa 45° Comercial</h3>
    <p class="product-excerpt">Carriles de precisión con rodamientos lineales y capacidad de carga superior a 500 kg.</p>
    <div class="product-actions">
      <button class="btn-add-quote" data-product="Prensa 45°">
        + Agregar a Cotización
      </button>
    </div>
  </div>
</article>
